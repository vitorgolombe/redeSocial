<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Social Media</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Moldura externa do celular */
    .phone-frame {
      width: 375px;
      background-color: #111;
      border-radius: 42px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    /* Tela interna */
    .phone-screen {
      background-color: #ffffff;
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho do Post */
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-small {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #e1306c;
    }

    .username {
      font-weight: 600;
      font-size: 14px;
      color: #262626;
    }

    .more-options {
      color: #262626;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* Mídia Principal e Badge Sobreposto */
    .post-media {
      position: relative;
      width: 100%;
      height: 380px;
      background-color: #000;
      cursor: pointer;
      user-select: none;
    }

    .main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Coração gigante que aparece no centro da foto ao dar clique duplo */
    .heart-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 85px;
      height: 85px;
      fill: #ffffff;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      pointer-events: none;
      opacity: 0;
    }

    .heart-overlay.animate {
      animation: heartBurst 0.8s ease-out forwards;
    }

    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.95; }
      50% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.95; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
    }

    .user-badge {
      position: absolute;
      bottom: 14px;
      left: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .user-badge img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .plus-icon {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      background-color: #0095f6;
      color: #ffffff;
      border-radius: 50%;
      border: 2px solid #ffffff;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1;
    }

    /* Barra de Interações */
    .post-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px;
    }

    .left-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: #262626;
      padding: 0;
      transition: opacity 0.2s;
    }

    .action-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-btn:hover {
      opacity: 0.6;
    }

    /* Estilo e animação do botão de curtida ativo */
    .action-btn.liked {
      color: #ed4956;
    }

    .action-btn.liked svg {
      fill: #ed4956;
      stroke: #ed4956;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* Detalhes / Curtidas */
    .post-details {
      padding: 0 16px 14px;
    }

    .likes {
      font-size: 13px;
      color: #262626;
    }

    /* Navegação Inferior */
    .nav-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0 18px;
      border-top: 1px solid #efefef;
    }

    .nav-item {
      color: #262626;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item:first-child svg {
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen">
      <!-- Cabeçalho do Post -->
      <div class="post-header">
        <div class="user-info">
          <img class="avatar-small"
            src="https://upload.wikimedia.org/wikipedia/commons/1/13/Lamine_Yamal_France_v_Spain_7.24.26-142.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original"
            alt="Avatar">
          <span class="username">vitorcontraeros</span>
        </div>
        <div class="more-options">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2" />
            <circle cx="12" cy="12" r="2" />
            <circle cx="19" cy="12" r="2" />
          </svg>
        </div>
      </div>

      <!-- Mídia Principal -->
      <div class="post-media" id="post-media">
        <img class="main-img"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLUsUz8RdbH5Bl57-Pufzytp8jtFBa9Iy-mofysCmVuWJxar4e5W1kKuA&s=10"
          alt="Post photo">
        
        <!-- Coração animado no clique duplo -->
        <svg class="heart-overlay" id="heart-overlay" viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>

        <!-- Sticker/Badge sobreposto na foto -->
        <div class="user-badge">
          <img src="https://img.a.transfermarkt.technology/portrait/big/342229-1682683695.jpg?lm=4711" alt="User overlay">
          <div class="plus-icon">+</div>
        </div>
      </div>

      <!-- Barra de Interações -->
      <div class="post-actions">
        <div class="left-actions">
          <button class="action-btn" id="like-btn">
            <svg viewBox="0 0 24 24">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span id="like-count">1200</span>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            57
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            24
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            6
          </button>
        </div>
        <button class="action-btn">
          <svg viewBox="0 0 24 24">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
      </div>

      <!-- Detalhes / Curtidas -->
      <div class="post-details">
        <p class="likes">Liked by <strong>liam_beanz99</strong> and <strong id="others-count">235 others</strong></p>
      </div>

      <!-- Navegação Inferior -->
      <div class="nav-bar">
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
        </div>
        <div class="nav-item">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <div class="nav-item">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </div>
        <div class="nav-item">
          <svg viewBox="0 0 24 24">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <div class="nav-item">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const likeBtn = document.getElementById('like-btn');
    const likeCount = document.getElementById('like-count');
    const othersCount = document.getElementById('others-count');
    const postMedia = document.getElementById('post-media');
    const heartOverlay = document.getElementById('heart-overlay');

    let liked = false;
    let totalLikes = 1200;
    let totalOthers = 235;

    function updateLikeUI() {
      if (liked) {
        likeBtn.classList.add('liked');
        totalLikes++;
        totalOthers++;
      } else {
        likeBtn.classList.remove('liked');
        totalLikes--;
        totalOthers--;
      }
      likeCount.textContent = totalLikes;
      othersCount.textContent = `${totalOthers} others`;
    }

    // Clique no botão de coração
    likeBtn.addEventListener('click', () => {
      liked = !liked;
      updateLikeUI();
    });

    // Clique duplo na foto (mostra o coração branco gigante no meio e curte)
    postMedia.addEventListener('dblclick', () => {
      heartOverlay.classList.remove('animate');
      void heartOverlay.offsetWidth; // Reinicia a animação
      heartOverlay.classList.add('animate');

      if (!liked) {
        liked = true;
        updateLikeUI();
      }
    });
  </script>
</body>
</html>
